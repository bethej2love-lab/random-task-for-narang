<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>할 일 랜덤 뽑기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --accent: #4b8cff;
      --accent-soft: #8faefc;
      --accent-bg: #f4f4f4;
      --card-bg: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding-top: 40px;
      background: var(--accent-bg, #f4f4f4);
      transition: background 0.3s ease;
    }
    .card {
      background: var(--card-bg, #ffffff);
      padding: 24px 32px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.3s ease, box-shadow 0.2s ease, transform 0.1s ease;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .theme-label {
      font-size: 18px;
      margin-bottom: 20px;
    }
    #result {
      font-size: 22px;
      font-weight: 700;
      margin: 20px 0 8px;
      min-height: 32px;
    }
    #hint {
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
      min-height: 16px;
    }
    button.main {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: var(--accent, #4b8cff);
      color: white;
      font-weight: 600;
      width: 100%;
      transition: transform 0.05s ease, opacity 0.1s ease, background 0.2s ease, box-shadow 0.1s ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }
    button.main:active {
      transform: scale(0.97);
      opacity: 0.9;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
    }
    button.main:disabled {
      opacity: 0.6;
      cursor: default;
      background: var(--accent-soft, #8faefc);
      box-shadow: none;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
      margin-bottom: 6px;
    }
    .action-buttons button {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .complete-btn {
      background: #2ecc71;
      color: white;
    }
    .pending-btn {
      background: #e0e0e0;
      color: #333;
    }

    /* 퉁치기 버튼 */
    .tung-container {
      display: none;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .tung-btn {
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      background: #f1f1f1;
      color: #555;
      cursor: pointer;
    }
    .tung-btn:active {
      transform: scale(0.97);
    }

    .progress-box {
      margin-top: 12px;
      text-align: left;
      font-size: 14px;
    }
    .status-summary {
      font-size: 13px;
      margin-bottom: 6px;
      text-align: right;
      color: #444;
    }
    .progress-bar {
      margin-top: 4px;
      font-size: 18px;
      letter-spacing: 2px;
      text-align: center;
    }
    .checkbox-list {
      margin-top: 12px;
      font-size: 14px;
    }
    .checkbox-list div {
      margin-bottom: 6px;
    }
    .streak-box {
      margin-top: 16px;
      font-size: 13px;
    }
    .streak-bar {
      margin-top: 4px;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e0e0e0;
      overflow: hidden;
    }
    .streak-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent, #4b8cff), #2ecc71);
      transition: width 0.3s ease;
    }
    #eventText {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
    .s-glow {
      color: #e67e22;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.9);
      animation: sPulse 0.8s ease-in-out 2;
    }
    @keyframes sPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .tier-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: #999;
      border: 1px solid #ddd;
      padding: 2px 6px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* 공통 모달 오버레이 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 18px 16px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      box-sizing: border-box;
      color: #222;
    }

    /* 주간 통계 모달 전용 */
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
    }
    .weekly-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .weekly-label {
      color: #555;
    }
    .weekly-bar {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      letter-spacing: 1px;
    }
    .modal-close-btn {
      margin-top: 10px;
      width: 100%;
      border-radius: 999px;
      border: none;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent, #4b8cff);
      color: #fff;
    }

    /* 퉁치기 모달 전용 */
    .tung-modal-content {
      padding-top: 16px;
    }
    .tung-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .tung-title {
      font-size: 14px;
      font-weight: 700;
    }
    .tung-close {
      border: none;
      background: transparent;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .tung-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .tung-option-btn {
      flex: 1 1 calc(50% - 6px);
      padding: 8px 6px;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid #eee;
      background: #f9fafb;
      cursor: pointer;
    }
    .tung-option-btn:active {
      transform: scale(0.97);
      background: #e5e7eb;
    }
    .tung-subtext {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
      text-align: right;
    }
    .tung-coin-actions {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tung-coin-btn {
      width: 100%;
      padding: 8px 6px;
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      cursor: pointer;
    }
    .tung-coin-btn:active {
      transform: scale(0.97);
      background: #e5e7eb;
    }

    /* 달력 스타일 */
    #toggleCalendarButton {
      margin-top: 10px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #ffffff;
      cursor: pointer;
    }
    #calendarContainer {
      margin-top: 10px;
      font-size: 11px;
    }
    .calendar-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      text-align: center;
    }
    .calendar-table {
      width: 100%;
      border-collapse: collapse;
    }
    .calendar-table th,
    .calendar-table td {
      border: 1px solid #eee;
      text-align: center;
      padding: 4px 2px;
      vertical-align: top;
      min-width: 32px;
    }
    .calendar-table th {
      background: #f8f8f8;
      font-weight: 600;
    }
    .cal-day-number {
      font-weight: 600;
      margin-bottom: 2px;
    }
    .cal-day-tasks {
      color: #555;
    }
    .cal-today {
      background: rgba(75, 140, 255, 0.15);
    }

    /* 모바일 최적화 */
    @media (max-width: 480px) {
      body {
        padding-top: 24px;
      }
      .card {
        padding: 20px 18px;
        border-radius: 14px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 18px;
      }
      #result {
        font-size: 20px;
      }
      button.main {
        font-size: 15px;
        padding: 12px 16px;
      }
      .checkbox-list {
        font-size: 13px;
      }
      .modal-overlay {
        align-items: flex-end;
      }
      .modal-content {
        max-width: 480px;
        width: 100%;
        border-radius: 16px 16px 0 0;
      }
      .calendar-table th,
      .calendar-table td {
        padding: 3px 1px;
      }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>할 일 랜덤 뽑기</h1>
    <div class="theme-label" id="themeLabel"></div>

    <button class="main" id="pickButton" onclick="pickRandom()">지금 당장 이거!</button>

    <div id="result">버튼을 눌러 시작!</div>
    <div id="hint"></div>

    <div class="action-buttons" style="display:none;" id="actionButtons">
      <button class="complete-btn" onclick="markComplete()">완료</button>
      <button class="pending-btn" onclick="markPending()">보류</button>
    </div>

    <!-- 퉁치기 버튼 -->
    <div class="tung-container" id="tungContainer">
      <button class="tung-btn" onclick="openTungModal()">퉁치기</button>
    </div>

    <!-- 진행도 + 체크리스트 + 연간 퍼센트 (첫 화면에서는 안 보임) -->
    <div class="progress-box" id="progressContainer" style="display:none;">
      <div class="status-summary" id="statusSummary">코인: 0개 · LV 1</div>

      <div id="progressText">오늘 완료: 0 / 7</div>
      <div class="progress-bar" id="progressBar">○○○○○○○○○○</div>
      <div class="checkbox-list" id="checkboxList"></div>

      <div class="streak-box">
        <div id="streakText">올해 전부 다 한 날: 0일 / 351일 (0.0%)</div>
        <div class="streak-bar">
          <div class="streak-fill" id="streakFill"></div>
        </div>
      </div>

      <div class="streak-box" style="margin-top:12px;">
        <div id="taskStreakText">올해 누적 완료: 0개 / 2457개 (0.0%)</div>
        <div class="streak-bar">
          <div class="streak-fill" id="taskStreakFill"></div>
        </div>
      </div>

      <div id="eventText"></div>

      <!-- 달력 토글 버튼 + 컨테이너 -->
      <button id="toggleCalendarButton" onclick="toggleCalendar()">달력 보기</button>
      <div id="calendarContainer" style="display:none;">
        <div id="calendarNav" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <button onclick="changeMonth(-1)" style="border:none; background:transparent; font-size:20px; cursor:pointer; padding:4px 8px;">◀</button>
          <span id="calendarMonthTitle" style="font-size:15px; font-weight:700;"></span>
          <button onclick="changeMonth(1)" style="border:none; background:transparent; font-size:20px; cursor:pointer; padding:4px 8px;">▶</button>
        </div>
        <div id="calendarTableContainer"></div>
      </div>
      <div style="display:flex; justify-content:flex-end; align-items:center; margin-top:8px;">
        <span id="perfectDaysCount" style="font-size:13px; font-weight:600; color:#e74c3c;"></span>
      </div>
    </div>
  </div>

  <!-- 전체 완료 축하 모달 -->
  <div class="modal-overlay" id="allDoneModal">
    <div class="modal-content" style="text-align:center;">
      <div style="font-size:48px; margin-bottom:8px;">🎉</div>
      <div class="modal-title" style="font-size:18px;">오늘 할 일 전부 완료!</div>
      <div style="font-size:13px; color:#555; margin-bottom:16px;" id="allDoneSubtext"></div>
      <button class="modal-close-btn" onclick="closeAllDoneModal()">고생했어요 😊</button>
    </div>
  </div>

  <!-- 최근 7일 통계 모달 -->
  <div class="modal-overlay" id="weeklyModal">
    <div class="modal-content">
      <div class="modal-title">최근 7일 완료 현황</div>
      <div id="weeklyStatsBody"></div>
      <button class="modal-close-btn" onclick="closeWeeklyStats()">확인</button>
    </div>
  </div>

  <!-- 퉁치기 모달 -->
  <div class="modal-overlay" id="tungModal">
    <div class="modal-content tung-modal-content">
      <div class="tung-header">
        <div class="tung-title">오늘은 퉁치기…?</div>
        <button class="tung-close" onclick="closeTungModal()">×</button>
      </div>
      <div class="tung-options">
        <button class="tung-option-btn" onclick="pickTungOption('영화')">영화</button>
        <button class="tung-option-btn" onclick="pickTungOption('전시')">전시</button>
        <button class="tung-option-btn" onclick="pickTungOption('우쿨렐레')">우쿨렐레</button>
        <button class="tung-option-btn" onclick="pickTungOption('뜨개질')">뜨개질</button>
        <button class="tung-option-btn" onclick="pickTungOption('요리')">요리</button>
        <button class="tung-option-btn" onclick="pickTungOption('청소')">청소</button>
        <button class="tung-option-btn" onclick="pickTungOption('벌떡 기상')">벌떡 기상</button>
      </div>
      <div class="tung-subtext">
        기본 1회는 무료, 그 이후에는 코인으로 추가 퉁치기를 할 수 있어요.
      </div>

      <div class="tung-coin-actions">
        <button class="tung-coin-btn" onclick="useTungCoins(1, 20)">코인 20개로 오늘 완료 +1</button>
        <button class="tung-coin-btn" onclick="useTungCoins(2, 30)">코인 30개로 오늘 완료 +2</button>
        <button class="tung-coin-btn" onclick="useTungCoins(3, 50)">코인 50개로 오늘 완료 +3</button>
      </div>
    </div>
  </div>

  <script>
    const tasks = [
      "듀오링고",
      "Brilliant",
      "책 읽기",
      "플랭크 1분+간단 스트레칭",
      "부기스/블로그",
      "달리기",
      "자격증 공부"
    ];

    const hints = {
      "듀오링고": "→ 딱 2개만 !",
      "Brilliant": "→ 3개 이상 푸십쇼",
      "책 읽기": "→ 3페이지는 읽자..",
      "플랭크 1분+간단 스트레칭": "→ 몸을 움직여라!",
      "부기스/블로그": "→ 책 등록/블로그 업로드/인스타 업로드/리뷰 답글 뭐든 제발!",
      "달리기": "→ 5분이라도! (만보 대체 가능ㅎ)",
      "자격증 공부": "→ 컴활 2급 / 임상심리사 2급 / 청소년상담사 3급 / 투자자산운용사 / 정보처리기사 / 공인중개사 / 사회조사분석사"
    };

    // 등급 설정
    const taskTier = {
      "달리기": "S",
      "부기스/블로그": "S",
      "책 읽기": "A",
      "자격증 공부": "A",
      "Brilliant": "B",
      "플랭크 1분+간단 스트레칭": "B",
      "듀오링고": "B"
    };

    const tierLabel = {
      "S": "S급",
      "A": "A급",
      "B": "B급"
    };

    // 코인 기본 보상
    const baseReward = {
      "S": 3,
      "A": 2,
      "B": 1,
      "BONUS": 0
    };

    // 연간 기준일: 1월 15일 시작 → 351일 기준
    const YEAR_TOTAL_DAYS = 351;

    // 한국 기준 날짜 (로컬 시간 기준, YYYY-MM-DD)
    function getKSTDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    const today = getKSTDate();

    // 랜덤 버프/디버프 목록
    const dailyEvents = [
      { id: "buff_all_plus1",  label: "오늘의 버프: 모든 미션 코인 +1!", type: "buff" },
      { id: "buff_s_plus1",    label: "오늘의 버프: S급 미션 코인 +1!", type: "buff" },
      { id: "nerf_s_minus1",   label: "오늘의 디버프: S급 미션 코인 -1…", type: "debuff" },
      { id: "half_day_full",   label: "오늘의 특수: 4개만 완료해도 '완료한 날'로 인정!", type: "special" },
      { id: "buff_b_plus2",    label: "오늘의 버프: B급 미션 코인 +2!", type: "buff" },
      { id: "nerf_all_minus1", label: "오늘의 디버프: 모든 미션 코인 -1…", type: "debuff" },
      { id: "lucky_day",       label: "오늘의 특수: 첫 미션 완료 시 보너스 코인 +3!", type: "special" },
      { id: "buff_a_plus2",    label: "오늘의 버프: A급 미션 코인 +2!", type: "buff" },
      { id: "double_first",    label: "오늘의 버프: 첫 번째로 완료한 미션 코인 2배!", type: "buff" },
      { id: "nerf_b_zero",     label: "오늘의 디버프: B급 미션 코인이 없어요… 어쩔 수 없지 뭐", type: "debuff" },
      { id: "special_5done",   label: "오늘의 특수: 5개 완료 시 보너스 코인 +5!", type: "special" },
      { id: "buff_last_plus3", label: "오늘의 버프: 마지막 미션 완료 시 코인 +3 추가!", type: "buff" }
    ];

    function loadTaskStatus() {
      const stored = JSON.parse(localStorage.getItem("taskStatus"));
      const storedDate = localStorage.getItem("taskDate");

      if (!stored || storedDate !== today) {
        const reset = {};
        tasks.forEach(t => reset[t] = false);
        localStorage.setItem("taskStatus", JSON.stringify(reset));
        localStorage.setItem("taskDate", today);
        return reset;
      }
      return stored;
    }

    function loadFullDays() {
      const count = parseInt(localStorage.getItem("fullCompleteCount") || "0", 10);
      const lastDate = localStorage.getItem("fullCompleteDate") || "";
      return { count, lastDate };
    }

    function loadCoins() {
      return parseInt(localStorage.getItem("coinCount") || "0", 10);
    }

    function loadDailyEvent() {
      const storedId = localStorage.getItem("dailyEventId");
      const storedDate = localStorage.getItem("dailyEventDate");

      if (!storedId || storedDate !== today) {
        const event = dailyEvents[Math.floor(Math.random() * dailyEvents.length)];
        localStorage.setItem("dailyEventId", event.id);
        localStorage.setItem("dailyEventDate", today);
        return event;
      } else {
        const found = dailyEvents.find(e => e.id === storedId);
        return found || dailyEvents[0];
      }
    }

    function loadDailyStats() {
      const raw = localStorage.getItem("dailyStats");
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e) { return {}; }
    }

    function saveDailyStats(stats) {
      localStorage.setItem("dailyStats", JSON.stringify(stats));
    }

    function loadWeeklyPopupStatus() {
      const raw = localStorage.getItem("weeklyPopupStatus");
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e) { return {}; }
    }

    function saveWeeklyPopupStatus(status) {
      localStorage.setItem("weeklyPopupStatus", JSON.stringify(status));
    }

    let { count: tungCount, freeUsed: tungFreeUsed } = loadTungState();

    let taskStatus = loadTaskStatus();
    let { count: fullCompleteCount, lastDate: fullCompleteDate } = loadFullDays();
    let coinCount = loadCoins();
    let dailyEvent = loadDailyEvent();
    let isPicking = false;
    let hasShownProgress = false;
    let currentTask = null;
    let currentTier = null;
    let skippedTasks = {};

    function getLevel(percent) {
      const lvl = Math.floor(percent / 5) + 1;
      return Math.min(20, Math.max(1, lvl));
    }

    function getRewardForTask(taskName) {
      const tier = taskTier[taskName] || "B";
      let reward = baseReward[tier];

      if (tier === "BONUS") return 0;

      if (dailyEvent.id === "buff_all_plus1" && reward > 0) reward += 1;
      if (dailyEvent.id === "buff_s_plus1" && tier === "S") reward += 1;
      if (dailyEvent.id === "nerf_s_minus1" && tier === "S") reward = Math.max(0, reward - 1);
      if (dailyEvent.id === "buff_b_plus2" && tier === "B") reward += 2;
      if (dailyEvent.id === "nerf_all_minus1" && reward > 0) reward = Math.max(0, reward - 1);
      if (dailyEvent.id === "buff_a_plus2" && tier === "A") reward += 2;
      if (dailyEvent.id === "nerf_b_zero" && tier === "B") reward = 0;

      return reward;
    }

    function getCompletedCount() {
      const base = Object.values(taskStatus).filter(v => v).length;
      const bonus = tungCount;
      return Math.min(tasks.length, base + bonus);
    }

    function updateUI() {
      const completed = getCompletedCount();

      // 오늘을 "완료한 날"로 인정하는 기준
      let fullNeeded = tasks.length;
      if (dailyEvent.id === "half_day_full") {
        fullNeeded = Math.ceil(tasks.length / 2);
      }

      if (completed >= fullNeeded && fullCompleteDate !== today) {
        fullCompleteCount += 1;
        fullCompleteDate = today;
        localStorage.setItem("fullCompleteCount", String(fullCompleteCount));
        localStorage.setItem("fullCompleteDate", fullCompleteDate);
      }

      // 오늘 완료 개수 → 일별 통계에 저장
      const stats = loadDailyStats();
      stats[today] = completed;
      saveDailyStats(stats);

      // 오늘 진행도
      document.getElementById("progressText").textContent =
        `오늘 완료: ${completed} / ${tasks.length}`;

      const circle = "●".repeat(completed) + "○".repeat(tasks.length - completed);
      document.getElementById("progressBar").textContent = circle;

      const listEl = document.getElementById("checkboxList");
      listEl.innerHTML = "";
      tasks.forEach(t => {
        const div = document.createElement("div");
        div.textContent = (taskStatus[t] ? "✔ " : "□ ") + t;
        listEl.appendChild(div);
      });

      // 351일 기준으로 연간 퍼센트 계산
      const percent = Math.min(100, (fullCompleteCount / YEAR_TOTAL_DAYS) * 100);
      const level = getLevel(percent);

      document.getElementById("streakText").textContent =
        `올해 전부 다 한 날: ${fullCompleteCount}일 / ${YEAR_TOTAL_DAYS}일 (${percent.toFixed(1)}%)`;
      document.getElementById("streakFill").style.width = `${percent}%`;

      // 할 일 개수 기준 누적 그래프
      const TASK_TOTAL = YEAR_TOTAL_DAYS * tasks.length; // 351 * 7 = 2457
      const allStats = loadDailyStats();
      const totalTasksDone = Object.values(allStats).reduce((sum, v) => sum + v, 0);
      const taskPercent = Math.min(100, (totalTasksDone / TASK_TOTAL) * 100);
      const taskStreakEl = document.getElementById("taskStreakText");
      const taskFillEl = document.getElementById("taskStreakFill");
      if (taskStreakEl) taskStreakEl.textContent =
        `올해 누적 완료: ${totalTasksDone}개 / ${TASK_TOTAL}개 (${taskPercent.toFixed(1)}%)`;
      if (taskFillEl) taskFillEl.style.width = `${taskPercent}%`;

      // 코인 + 레벨 표시
      document.getElementById("statusSummary").textContent =
        `코인: ${coinCount}개 · LV ${level}`;

      // 오늘의 버프/디버프 표시
      const eventEl = document.getElementById("eventText");
      eventEl.textContent = dailyEvent.label;
      if (dailyEvent.type === "buff") {
        eventEl.style.color = "#2ecc71";
      } else if (dailyEvent.type === "debuff") {
        eventEl.style.color = "#e74c3c";
      } else {
        eventEl.style.color = "#f39c12";
      }

      updateTungButtonVisibility();
    }

      if (!hasShownProgress) {
        document.getElementById("progressContainer").style.display = "block";
        hasShownProgress = true;
      }
    }

    function updateTungButtonVisibility() {
      const container = document.getElementById("tungContainer");

        return;

      if (completed >= tasks.length) {
        container.style.display = "none";
      } else {
        container.style.display = "flex";
      }
    }

    function buildLast7DaysData() {
      const stats = loadDailyStats();
      const [y, m, d] = today.split("-").map(Number);
      const base = new Date(y, m - 1, d);
      const result = [];

      for (let i = 6; i >= 0; i--) {
        const dt = new Date(base);
        dt.setDate(base.getDate() - i);
        const yy = dt.getFullYear();
        const mm = String(dt.getMonth() + 1).padStart(2, "0");
        const dd = String(dt.getDate()).padStart(2, "0");
        const key = `${yy}-${mm}-${dd}`;
        const cnt = stats[key] || 0;
        result.push({ key, label: `${mm}/${dd}`, count: cnt });
      }
      return result;
    }

    function checkAndShowWeeklyStats() {
      const completed = getCompletedCount();

      // 전체 완료 축하 팝업 (주간 통계보다 우선)
      if (completed >= tasks.length) {
        const shownToday = localStorage.getItem("allDonePopupDate");
        if (shownToday !== today) {
          localStorage.setItem("allDonePopupDate", today);
          setTimeout(() => showAllDoneModal(), 300);
          return;
        }
      }

      const thresholds = [2, 4, 6];
      if (!thresholds.includes(completed)) return;

      const status = loadWeeklyPopupStatus();
      const todayStatus = status[today] || {};
      if (todayStatus[completed]) return;

      todayStatus[completed] = true;
      status[today] = todayStatus;
      saveWeeklyPopupStatus(status);
      openWeeklyStatsModal();
    }

    function loadTungState() {
      const storedDate = localStorage.getItem("tungDate");
      if (storedDate !== today) {
        localStorage.setItem("tungDate", today);
        localStorage.setItem("tungCount", "0");
        localStorage.setItem("tungFreeUsed", "0");
        localStorage.removeItem("tungChoice");
        return { count: 0, freeUsed: false };
      } else {
        const count = parseInt(localStorage.getItem("tungCount") || "0", 10);
        const freeUsed = localStorage.getItem("tungFreeUsed") === "1";
        return { count, freeUsed };
      }
    }

    let currentViewYear = 2026;
    let currentViewMonth = 2;

    function buildMonthlyCalendar(year, month) {
      const stats = loadDailyStats();
      const container = document.getElementById("calendarTableContainer");
      container.innerHTML = "";

      const firstDay = new Date(year, month - 1, 1).getDay();
      const lastDate = new Date(year, month, 0).getDate();

      document.getElementById("calendarMonthTitle").textContent = `${year}년 ${month}월`;

      let perfectDaysCount = 0;
      for (const dateKey in stats) {
        if (stats[dateKey] === tasks.length) perfectDaysCount++;
      }

      const perfectDaysEl = document.getElementById("perfectDaysCount");
      if (perfectDaysEl) perfectDaysEl.textContent = `♥ ${perfectDaysCount} ♥`;

      const table = document.createElement("table");
      table.className = "calendar-table";

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      ["일", "월", "화", "수", "목", "금", "토"].forEach(w => {
        const th = document.createElement("th");
        th.textContent = w;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      let row = document.createElement("tr");
      let cellCount = 0;

      for (let i = 0; i < firstDay; i++) {
        row.appendChild(document.createElement("td"));
        cellCount++;
      }

      for (let day = 1; day <= lastDate; day++) {
        if (cellCount === 7) {
          tbody.appendChild(row);
          row = document.createElement("tr");
          cellCount = 0;
        }

        const td = document.createElement("td");
        const dd = String(day).padStart(2, "0");
        const mm = String(month).padStart(2, "0");
        const key = `${year}-${mm}-${dd}`;
        const cnt = stats[key] || 0;

        const num = document.createElement("div");
        num.className = "cal-day-number";
        num.textContent = day;

        const info = document.createElement("div");
        info.className = "cal-day-tasks";
        info.textContent = `${cnt}/${tasks.length}`;

        td.appendChild(num);
        td.appendChild(info);
        if (cnt === tasks.length) {
          td.style.background = "rgba(46, 204, 113, 0.25)";
        } else if (cnt >= Math.ceil(tasks.length / 2)) {
          td.style.background = "rgba(241, 196, 15, 0.2)";
        }
        if (key === today) td.classList.add("cal-today");

        row.appendChild(td);
        cellCount++;
      }

      if (cellCount > 0 && cellCount < 7) {
        for (let i = cellCount; i < 7; i++) row.appendChild(document.createElement("td"));
        tbody.appendChild(row);
      } else if (cellCount === 7) {
        tbody.appendChild(row);
      }

      table.appendChild(tbody);
      container.appendChild(table);
    }

    function changeMonth(delta) {
      currentViewMonth += delta;
      if (currentViewMonth > 12) { currentViewMonth = 1; currentViewYear++; }
      else if (currentViewMonth < 1) { currentViewMonth = 12; currentViewYear--; }
      buildMonthlyCalendar(currentViewYear, currentViewMonth);
    }

    function toggleCalendar() {
      const container = document.getElementById("calendarContainer");
      const btn = document.getElementById("toggleCalendarButton");

      if (container.style.display === "none" || !container.style.display) {
        const [y, m] = today.split("-").map(Number);
        currentViewYear = y;
        currentViewMonth = m;
        buildMonthlyCalendar(currentViewYear, currentViewMonth);
        container.style.display = "block";
        btn.textContent = "달력 닫기";
      } else {
        container.style.display = "none";
        btn.textContent = "달력 보기";
      }
    }

    function pickRandom() {
      if (isPicking) return;
      isPicking = true;

      const pickBtn = document.getElementById("pickButton");
      const resultEl = document.getElementById("result");
      const hintEl = document.getElementById("hint");

      pickBtn.disabled = true;
      pickBtn.textContent = "고르는 중...";

      document.getElementById("actionButtons").style.display = "none";
      resultEl.classList.remove("s-glow");

      const available = tasks.filter(t => !taskStatus[t] && !skippedTasks[t]);

      if (available.length === 0) {
        const remaining = tasks.filter(t => !taskStatus[t]);

        if (remaining.length === 0) {
          resultEl.textContent = "오늘 할 일 완료!";
          hintEl.textContent = "";
        } else {
          resultEl.textContent = "보류한 미션만 남았어요. 오늘은 여기까지!";
          hintEl.textContent = "보류를 초기화하려면 새로고침하면 돼요.";
        }

        pickBtn.disabled = false;
        pickBtn.textContent = "지금 당장 이거!";
        isPicking = false;
        showProgressIfNeeded();
        updateTungButtonVisibility();
        return;
      }

      let dots = 0;
      resultEl.textContent = "고민 중";
      hintEl.textContent = "2초만 기다려줘…";
      const loading = setInterval(() => {
        dots = (dots + 1) % 4;
        resultEl.textContent = "고민 중" + ".".repeat(dots);
      }, 400);

      setTimeout(() => {
        clearInterval(loading);

        const finalChoice = available[Math.floor(Math.random() * available.length)];
        const finalTier = taskTier[finalChoice] || "B";

        currentTask = finalChoice;
        currentTier = finalTier;

        const label = tierLabel[finalTier] || "B급";
        const badge = `<span class="tier-label">${label}</span>`;
        const safeText = finalChoice.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        resultEl.innerHTML = `${badge}${safeText}`;

        const baseHint = hints[finalChoice] || "";
        if (finalTier === "S") {
          resultEl.classList.add("s-glow");
          hintEl.textContent = `✨ S급 미션 등장! ✨ ${baseHint}`;
        } else {
          hintEl.textContent = baseHint;
        }

        document.getElementById("actionButtons").style.display = "flex";

        pickBtn.disabled = false;
        pickBtn.textContent = "지금 당장 이거!";
        isPicking = false;

        showProgressIfNeeded();
        updateTungButtonVisibility();
      }, 2000);
    }

    function markComplete() {
      if (!currentTask || !tasks.includes(currentTask)) return;

      if (taskStatus[currentTask]) {
        document.getElementById("hint").textContent = "이미 완료한 미션이에요!";
        hideButtons();
        return;
      }

      taskStatus[currentTask] = true;
      localStorage.setItem("taskStatus", JSON.stringify(taskStatus));

      let reward = getRewardForTask(currentTask);

      const completedCount = Object.values(taskStatus).filter(v => v).length;

      // 첫 미션 보너스 (lucky_day)
      if (dailyEvent.id === "lucky_day" && completedCount === 1) {
        reward += 3;
        document.getElementById("hint").textContent =
          `완료 기록되었습니다! (+${reward}코인, 첫 미션 보너스 +3 포함!)`;

      // 첫 미션 2배 (double_first)
      } else if (dailyEvent.id === "double_first" && completedCount === 1) {
        reward = reward * 2;
        document.getElementById("hint").textContent =
          `완료 기록되었습니다! (+${reward}코인, 첫 미션 2배 보너스!)`;

      // 5개 완료 보너스 (special_5done)
      } else if (dailyEvent.id === "special_5done" && completedCount === 5) {
        reward += 5;
        document.getElementById("hint").textContent =
          `완료 기록되었습니다! (+${reward}코인, 5개 달성 보너스 +5 포함!)`;

      // 마지막 미션 보너스 (buff_last_plus3)
      } else if (dailyEvent.id === "buff_last_plus3" && completedCount === tasks.length) {
        reward += 3;
        document.getElementById("hint").textContent =
          `완료 기록되었습니다! (+${reward}코인, 마지막 미션 보너스 +3 포함!)`;

      } else if (reward > 0) {
        document.getElementById("hint").textContent =
          `완료 기록되었습니다! (+${reward}코인)`;
      } else {
        document.getElementById("hint").textContent = "완료 기록되었습니다!";
      }

      if (reward > 0) {
        coinCount += reward;
        localStorage.setItem("coinCount", String(coinCount));
      }

      hideButtons();
      updateUI();
      checkAndShowWeeklyStats();
    }

    function useTungCoins(addCount, cost) {
      if (coinCount < cost) {
        document.getElementById("hint").textContent = `코인이 부족해요. (필요: ${cost}코인)`;
        return;
      }

      const completed = getCompletedCount();
      const remaining = tasks.length - completed;

      if (remaining <= 0) {
        document.getElementById("hint").textContent = "오늘 할 일은 이미 모두 완료했어요!";
        closeTungModal();
        return;
      }

      const actualAdd = Math.min(addCount, remaining);
      coinCount -= cost;
      tungCount += actualAdd;

      localStorage.setItem("coinCount", String(coinCount));
      localStorage.setItem("tungCount", String(tungCount));
      localStorage.setItem("tungDate", today);

      document.getElementById("hint").textContent =
        `코인 ${cost}개를 사용해 오늘 완료 ${actualAdd}개를 퉁쳤어요!`;

      closeTungModal();
      updateUI();
      checkAndShowWeeklyStats();
    }
  </script>
</body>
</html>
